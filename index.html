"Wichtige Info:", "Kurz und knapp:", "Ohne Übertreibung:", "Breaking News:",

const emojis = ["🌸","✨","💖","🌷","🦋","🌙","☀️","💫","🌺","👑","🌈","💪","🌻","💕","⭐","🍓","🎀","🔥","🌊","🕊️","💎","🌼","🚀","🫶","🌟","🍀","🎶","🌅","💐","🥰","🍒","🧁","🌞","🌿","🍯","🎈","🪷","☕","💗","😊"];

function lowerFirst(s){ return s.startsWith("Rina") ? s : s.charAt(0).toLowerCase() + s.slice(1); }

// Jeder Basis-Spruch hat Varianten: zuerst pur, danach mit Einleitungen
const bases = [
  ...compliments.map(c => [c, ...openers.map(o => o + " " + lowerFirst(c))]),
  ...quotes.map(q => [q])
];
const total = bases.reduce((n,b)=>n+b.length,0);
const used = bases.map(()=>0);

let pool = [], round = 0, shown = 0;
function refill(){
  pool = bases.map((_,i)=>i).filter(i => used[i] < bases[i].length);
  if(!pool.length){ used.fill(0); pool = bases.map((_,i)=>i); }
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
}
function next(){
  if(!pool.length) refill();
  const i = pool.pop();
  const variants = bases[i];
  // ab der zweiten Runde zufällige, noch nicht benutzte Einleitung
  const t = variants[used[i]++];
  return t;
}
// Varianten (ausser der ersten) mischen, damit die Einleitungen zufällig kommen
bases.forEach(v => { for(let k=v.length-1;k>1;k--){const j=1+Math.floor(Math.random()*k);[v[k],v[j]]=[v[j],v[k]];} });

const msg = document.getElementById('msg'),
      emoji = document.getElementById('emoji'),
      text = document.getElementById('text'),
      count = document.getElementById('count');

function hearts(n=14){
  const sym=["💖","💕","💗","✨","🌸","💞"];
  for(let i=0;i<n;i++){
    const h=document.createElement('span');
    h.className='heart';
    h.textContent=sym[Math.floor(Math.random()*sym.length)];
    h.style.left=Math.random()*100+'vw';
    h.style.top=(80+Math.random()*25)+'vh';
    h.style.fontSize=(16+Math.random()*22)+'px';
    h.style.setProperty('--r',(Math.random()*120-60)+'deg');
    h.style.animationDuration=(2.5+Math.random()*2.5)+'s';
    h.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),5500);
  }
}

document.getElementById('btn').addEventListener('click',()=>{
  msg.classList.add('hide');
  setTimeout(()=>{
    emoji.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    text.textContent = next();
    msg.classList.remove('hide');
    shown++;
    count.textContent = shown + ' von über ' + Math.floor(total/100)*100 + ' Sprüchen 💗';
  },300);
  hearts();
});
